name: Generate stats cards

on:
  push:
    branches: [master]
    paths-ignore: ["generated/**", "README.md"]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # 3.8 is EOL and has no build for Ubuntu 26.04, which is what broke the old job.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Generate cards
        run: python generate_images.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDED: ${{ secrets.EXCLUDED }}
          EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
          EXCLUDE_FORKED_REPOS: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generated
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "chore: refresh stats cards"
          git push
