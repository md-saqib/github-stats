<svg xmlns="http://www.w3.org/2000/svg" width="410" height="220" viewBox="0 0 410 220" fill="none" role="img" aria-labelledby="title">
<title id="title">Contribution mix over the last year</title>
<style>.sans{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:.12em}.num{font-variant-numeric:tabular-nums}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}.rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}.fade{animation:fade .6s ease-out both}@keyframes draw{from{stroke-dasharray:0 100}}.arc{animation:draw 1.1s cubic-bezier(.22,1,.36,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<clipPath id="clip"><rect width="410" height="220" rx="12"/></clipPath>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#1f2328" stroke-opacity=".06"/></pattern>
<radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(308 0) scale(287 264)"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="fade"><rect width="410" height="220" fill="url(#glow)"/></mask>
<radialGradient id="tint" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(410 0) scale(308 308)"><stop stop-color="#db2777" stop-opacity=".22"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient>
<radialGradient id="tint2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 220) scale(246 242)"><stop stop-color="#7c3aed" stop-opacity=".14"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<linearGradient id="brand" x1="0" x2="410" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
<linearGradient id="rule" x1="24" x2="386" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#db2777"/><stop offset=".6" stop-color="#7c3aed" stop-opacity=".5"/><stop offset="1" stop-color="#d8dee4"/></linearGradient>
</defs>
<g clip-path="url(#clip)"><rect width="410" height="220" fill="#ffffff"/><rect width="410" height="220" fill="url(#tint)"/><rect width="410" height="220" fill="url(#tint2)"/><rect width="410" height="220" fill="url(#grid)" mask="url(#fade)"/><rect width="410" height="3" fill="url(#brand)"/></g>
<rect x=".5" y=".5" width="409" height="219" rx="11.5" stroke="#d8dee4"/>
<text class="mono fade" x="24" y="34" font-size="11" fill="#59636e"><tspan fill="#db2777">✦</tspan><tspan dx="8">CONTRIBUTION MIX</tspan></text><text class="mono fade" x="386" y="34" font-size="11" fill="#59636e" text-anchor="end">LAST 12 MONTHS</text>
<text class="sans rise" x="24" y="68" font-size="22" font-weight="600" letter-spacing="-.02em" fill="#1f2328"><tspan fill="#59636e">Mostly </tspan>commits</text>
<circle cx="88" cy="146" r="44" stroke="#eff2f5" stroke-width="14"/><circle class="arc" cx="88" cy="146" r="44" pathLength="100" stroke="#7c3aed" stroke-width="14" stroke-dasharray="92.30 7.70" stroke-dashoffset="-0.00" transform="rotate(-90 88 146)" style="animation-delay:200ms"/><circle class="arc" cx="88" cy="146" r="44" pathLength="100" stroke="#2563eb" stroke-width="14" stroke-dasharray="2.99 97.01" stroke-dashoffset="-93.10" transform="rotate(-90 88 146)" style="animation-delay:320ms"/><circle class="arc" cx="88" cy="146" r="44" pathLength="100" stroke="#1a7f37" stroke-width="14" stroke-dasharray="1.32 98.68" stroke-dashoffset="-96.88" transform="rotate(-90 88 146)" style="animation-delay:440ms"/><circle class="arc" cx="88" cy="146" r="44" pathLength="100" stroke="#db2777" stroke-width="14" stroke-dasharray="0.20 99.80" stroke-dashoffset="-99.00" transform="rotate(-90 88 146)" style="animation-delay:560ms"/><text class="sans num rise" x="88" y="150" font-size="20" font-weight="600" letter-spacing="-.02em" fill="#1f2328" text-anchor="middle">1,796</text><text class="mono rise" x="88" y="166" font-size="9" fill="#59636e" text-anchor="middle">TOTAL</text>
<g class="rise" style="animation-delay:300ms"><circle cx="172" cy="114.0" r="4.5" fill="#7c3aed"/><text class="sans" x="184" y="118.5" font-size="13" fill="#1f2328">Commits</text><text class="mono num" x="386" y="118.5" font-size="12" fill="#1f2328" text-anchor="end" letter-spacing="0">1,672<tspan fill="#59636e" dx="8">93%</tspan></text></g>
<g class="rise" style="animation-delay:370ms"><circle cx="172" cy="135.0" r="4.5" fill="#2563eb"/><text class="sans" x="184" y="139.5" font-size="13" fill="#1f2328">Pull requests</text><text class="mono num" x="386" y="139.5" font-size="12" fill="#1f2328" text-anchor="end" letter-spacing="0">68<tspan fill="#59636e" dx="8">4%</tspan></text></g>
<g class="rise" style="animation-delay:440ms"><circle cx="172" cy="156.0" r="4.5" fill="#1a7f37"/><text class="sans" x="184" y="160.5" font-size="13" fill="#1f2328">New repos</text><text class="mono num" x="386" y="160.5" font-size="12" fill="#1f2328" text-anchor="end" letter-spacing="0">38<tspan fill="#59636e" dx="8">2%</tspan></text></g>
<g class="rise" style="animation-delay:510ms"><circle cx="172" cy="177.0" r="4.5" fill="#db2777"/><text class="sans" x="184" y="181.5" font-size="13" fill="#1f2328">Code reviews</text><text class="mono num" x="386" y="181.5" font-size="12" fill="#1f2328" text-anchor="end" letter-spacing="0">18<tspan fill="#59636e" dx="8">1%</tspan></text></g>
</svg>
