<svg xmlns="http://www.w3.org/2000/svg" width="410" height="220" viewBox="0 0 410 220" fill="none" role="img" aria-labelledby="title">
<title id="title">Most used languages</title>
<style>.sans{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:.12em}.num{font-variant-numeric:tabular-nums}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}.rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}.fade{animation:fade .6s ease-out both}@keyframes grow{from{transform:scaleX(0)}}.grow{transform-origin:24px 0;animation:grow 1.2s cubic-bezier(.22,1,.36,1) .2s both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<clipPath id="clip"><rect width="410" height="220" rx="12"/></clipPath>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#1f2328" stroke-opacity=".06"/></pattern>
<radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(308 0) scale(287 264)"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="fade"><rect width="410" height="220" fill="url(#glow)"/></mask>
<radialGradient id="tint" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(410 0) scale(308 308)"><stop stop-color="#2563eb" stop-opacity=".22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
<radialGradient id="tint2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 220) scale(246 242)"><stop stop-color="#0891b2" stop-opacity=".14"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
<linearGradient id="brand" x1="0" x2="410" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
<linearGradient id="rule" x1="24" x2="386" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset=".6" stop-color="#0891b2" stop-opacity=".5"/><stop offset="1" stop-color="#d8dee4"/></linearGradient>
</defs>
<g clip-path="url(#clip)"><rect width="410" height="220" fill="#ffffff"/><rect width="410" height="220" fill="url(#tint)"/><rect width="410" height="220" fill="url(#tint2)"/><rect width="410" height="220" fill="url(#grid)" mask="url(#fade)"/><rect width="410" height="3" fill="url(#brand)"/></g>
<rect x=".5" y=".5" width="409" height="219" rx="11.5" stroke="#d8dee4"/>
<text class="mono fade" x="24" y="34" font-size="11" fill="#59636e"><tspan fill="#2563eb">✦</tspan><tspan dx="8">LANGUAGES</tspan></text><text class="mono fade" x="386" y="34" font-size="11" fill="#59636e" text-anchor="end">BY CODE SIZE</text>
<text class="sans rise" x="24" y="68" font-size="22" font-weight="600" letter-spacing="-.02em" fill="#1f2328"><tspan fill="#59636e">Mostly </tspan>HTML</text>
<defs><clipPath id="bar"><rect x="24" y="86" width="362" height="10" rx="5"/></clipPath></defs><rect x="24" y="86" width="362" height="10" rx="5" fill="#eff2f5"/><g clip-path="url(#bar)"><g class="grow"><rect x="24.00" y="86" width="137.19" height="10" fill="#e34c26"/><rect x="163.19" y="86" width="82.90" height="10" fill="#f1e05a"/><rect x="248.10" y="86" width="47.51" height="10" fill="#c6538c"/><rect x="297.61" y="86" width="42.43" height="10" fill="#663399"/><rect x="342.04" y="86" width="25.33" height="10" fill="#3178c6"/><rect x="369.37" y="86" width="16.63" height="10" fill="#59636e"/></g></g>
<g class="rise" style="animation-delay:300ms"><circle cx="29" cy="129" r="5" fill="#e34c26"/><text class="sans" x="42" y="134" font-size="14" fill="#1f2328">HTML</text><text class="mono num" x="193" y="134" font-size="12" fill="#59636e" text-anchor="end" letter-spacing="0">39.0%</text></g>
<g class="rise" style="animation-delay:370ms"><circle cx="29" cy="161" r="5" fill="#f1e05a"/><text class="sans" x="42" y="166" font-size="14" fill="#1f2328">JavaScript</text><text class="mono num" x="193" y="166" font-size="12" fill="#59636e" text-anchor="end" letter-spacing="0">23.6%</text></g>
<g class="rise" style="animation-delay:440ms"><circle cx="29" cy="193" r="5" fill="#c6538c"/><text class="sans" x="42" y="198" font-size="14" fill="#1f2328">SCSS</text><text class="mono num" x="193" y="198" font-size="12" fill="#59636e" text-anchor="end" letter-spacing="0">13.5%</text></g>
<g class="rise" style="animation-delay:510ms"><circle cx="222" cy="129" r="5" fill="#663399"/><text class="sans" x="235" y="134" font-size="14" fill="#1f2328">CSS</text><text class="mono num" x="386" y="134" font-size="12" fill="#59636e" text-anchor="end" letter-spacing="0">12.1%</text></g>
<g class="rise" style="animation-delay:580ms"><circle cx="222" cy="161" r="5" fill="#3178c6"/><text class="sans" x="235" y="166" font-size="14" fill="#1f2328">TypeScript</text><text class="mono num" x="386" y="166" font-size="12" fill="#59636e" text-anchor="end" letter-spacing="0">7.2%</text></g>
<g class="rise" style="animation-delay:650ms"><circle cx="222" cy="193" r="5" fill="#59636e"/><text class="sans" x="235" y="198" font-size="14" fill="#1f2328">Other</text><text class="mono num" x="386" y="198" font-size="12" fill="#59636e" text-anchor="end" letter-spacing="0">4.7%</text></g>
</svg>
