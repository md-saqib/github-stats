<svg xmlns="http://www.w3.org/2000/svg" width="410" height="220" viewBox="0 0 410 220" fill="none" role="img" aria-labelledby="title">
<title id="title">Contributions by day of the week</title>
<style>.sans{font-family:Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;letter-spacing:.12em}.num{font-variant-numeric:tabular-nums}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}.rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}.fade{animation:fade .6s ease-out both}@keyframes growy{from{transform:scaleY(0)}}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:growy .9s cubic-bezier(.22,1,.36,1) both}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<clipPath id="clip"><rect width="410" height="220" rx="12"/></clipPath>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#1f2328" stroke-opacity=".06"/></pattern>
<radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(308 0) scale(287 264)"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="fade"><rect width="410" height="220" fill="url(#glow)"/></mask>
<radialGradient id="tint" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(410 0) scale(308 308)"><stop stop-color="#0891b2" stop-opacity=".22"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
<radialGradient id="tint2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 220) scale(246 242)"><stop stop-color="#7c3aed" stop-opacity=".14"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
<linearGradient id="brand" x1="0" x2="410" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
<linearGradient id="rule" x1="24" x2="386" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#0891b2"/><stop offset=".6" stop-color="#7c3aed" stop-opacity=".5"/><stop offset="1" stop-color="#d8dee4"/></linearGradient>
</defs>
<g clip-path="url(#clip)"><rect width="410" height="220" fill="#ffffff"/><rect width="410" height="220" fill="url(#tint)"/><rect width="410" height="220" fill="url(#tint2)"/><rect width="410" height="220" fill="url(#grid)" mask="url(#fade)"/><rect width="410" height="3" fill="url(#brand)"/></g>
<rect x=".5" y=".5" width="409" height="219" rx="11.5" stroke="#d8dee4"/>
<text class="mono fade" x="24" y="34" font-size="11" fill="#59636e"><tspan fill="#0891b2">✦</tspan><tspan dx="8">WEEKLY RHYTHM</tspan></text><text class="mono fade" x="386" y="34" font-size="11" fill="#59636e" text-anchor="end">LAST 12 MONTHS</text>
<text class="sans rise" x="24" y="68" font-size="22" font-weight="600" letter-spacing="-.02em" fill="#1f2328"><tspan fill="#59636e">Most active on </tspan>Tuesdays</text>
<defs><linearGradient id="bars" x1="0" x2="0" y1="100" y2="186" gradientUnits="userSpaceOnUse"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs>
<path d="M24 186.5H386" stroke="#d8dee4"/>
<rect class="bar" x="35.9" y="157.9" width="28" height="28.1" rx="6" fill="url(#bars)" fill-opacity="0.5" style="animation-delay:200ms"/><g class="rise" style="animation-delay:500ms"><text class="mono num" x="49.9" y="151.9" font-size="10" letter-spacing="0" fill="#59636e" text-anchor="middle">124</text><text class="mono" x="49.9" y="205" font-size="10" fill="#59636e" text-anchor="middle">SUN</text></g>
<rect class="bar" x="87.6" y="120.6" width="28" height="65.4" rx="6" fill="url(#bars)" fill-opacity="0.5" style="animation-delay:280ms"/><g class="rise" style="animation-delay:580ms"><text class="mono num" x="101.6" y="114.6" font-size="10" letter-spacing="0" fill="#59636e" text-anchor="middle">289</text><text class="mono" x="101.6" y="205" font-size="10" fill="#59636e" text-anchor="middle">MON</text></g>
<rect class="bar" x="139.3" y="102.0" width="28" height="84.0" rx="6" fill="url(#bars)" fill-opacity="1" style="animation-delay:360ms"/><g class="rise" style="animation-delay:660ms"><text class="mono num" x="153.3" y="96.0" font-size="10" letter-spacing="0" fill="#1f2328" text-anchor="middle">371</text><text class="mono" x="153.3" y="205" font-size="10" fill="#0891b2" text-anchor="middle">TUE</text></g>
<rect class="bar" x="191.0" y="104.0" width="28" height="82.0" rx="6" fill="url(#bars)" fill-opacity="0.5" style="animation-delay:440ms"/><g class="rise" style="animation-delay:740ms"><text class="mono num" x="205.0" y="98.0" font-size="10" letter-spacing="0" fill="#59636e" text-anchor="middle">362</text><text class="mono" x="205.0" y="205" font-size="10" fill="#59636e" text-anchor="middle">WED</text></g>
<rect class="bar" x="242.7" y="135.5" width="28" height="50.5" rx="6" fill="url(#bars)" fill-opacity="0.5" style="animation-delay:520ms"/><g class="rise" style="animation-delay:820ms"><text class="mono num" x="256.7" y="129.5" font-size="10" letter-spacing="0" fill="#59636e" text-anchor="middle">223</text><text class="mono" x="256.7" y="205" font-size="10" fill="#59636e" text-anchor="middle">THU</text></g>
<rect class="bar" x="294.4" y="112.0" width="28" height="74.0" rx="6" fill="url(#bars)" fill-opacity="0.5" style="animation-delay:600ms"/><g class="rise" style="animation-delay:900ms"><text class="mono num" x="308.4" y="106.0" font-size="10" letter-spacing="0" fill="#59636e" text-anchor="middle">327</text><text class="mono" x="308.4" y="205" font-size="10" fill="#59636e" text-anchor="middle">FRI</text></g>
<rect class="bar" x="346.1" y="161.3" width="28" height="24.7" rx="6" fill="url(#bars)" fill-opacity="0.5" style="animation-delay:680ms"/><g class="rise" style="animation-delay:980ms"><text class="mono num" x="360.1" y="155.3" font-size="10" letter-spacing="0" fill="#59636e" text-anchor="middle">109</text><text class="mono" x="360.1" y="205" font-size="10" fill="#59636e" text-anchor="middle">SAT</text></g>
</svg>
